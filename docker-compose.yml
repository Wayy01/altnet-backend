version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: ultra-meilisearch
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-ultra-search-dev-key}
      - MEILI_ENV=${MEILISEARCH_ENV:-development}
      - MEILI_NO_ANALYTICS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  meilisearch_data:
    driver: local
